name: Finalize repository history

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize repository history'
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish clean release commit and tag
        shell: bash
        run: |
          set -euo pipefail

          rm -f .github/workflows/finalize-history.yml
          git add -A

          tree="$(git write-tree)"
          expected_tree="eab22d9c88fd135e83aaab27204b8784ee60622a"
          test "$tree" = "$expected_tree"

          root_commit="eb94cde9d9313fdcaceb82b5be5e1455584b1ca9"
          git cat-file -e "${root_commit}^{commit}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          release_commit="$(
            git commit-tree "$tree" \
              -p "$root_commit" \
              -m "Initial open source release"
          )"

          git tag -f -a v0.1.0 "$release_commit" \
            -m "Lightning Frame Stack v0.1.0"

          git push --force origin \
            "$release_commit:refs/heads/main"
          git push --force origin refs/tags/v0.1.0
