[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lightning-frame-stack"
version = "0.1.0"
description = "Align and combine every lightning strike from a GIF or video into one clean image."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "John Cotter", email = "4744962+johncotter3@users.noreply.github.com" },
]
keywords = [
  "lightning",
  "photography",
  "image-stacking",
  "opencv",
  "video-processing",
  "gif",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12",
]

[project.scripts]
lightning-stack = "lightning_frame_stack.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/johncotter3/lightning-frame-stack"
Documentation = "https://github.com/johncotter3/lightning-frame-stack#readme"
Issues = "https://github.com/johncotter3/lightning-frame-stack/issues"
Source = "https://github.com/johncotter3/lightning-frame-stack"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["lightning_frame_stack"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["docs/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T201"]
