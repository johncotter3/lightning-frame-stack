<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">Stacked synthetic lightning result</title>
  <desc id="desc">One night-sky image containing all three synthetic lightning strikes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17172c"/>
      <stop offset="0.62" stop-color="#2d2b4c"/>
      <stop offset="1" stop-color="#503748"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="500" rx="24" fill="#0c0d17"/>
  <g transform="translate(20 20) scale(2)">
    <rect width="340" height="230" rx="12" fill="url(#sky)"/>
    <g opacity="0.22" fill="#c8c9e8">
