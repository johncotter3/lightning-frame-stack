      <path d="M92 18 L86 43 L95 61 L82 87 L89 112 L72 145 M92 61 L111 72 L119 91 M83 88 L62 99 L53 118 M185 7 L173 34 L183 55 L166 76 L177 96 L158 133 M178 54 L202 68 L211 88 M168 76 L147 84 L137 105 M286 24 L275 48 L283 68 L267 92 L275 113 L254 147 M279 67 L302 78 L311 97 M268 92 L247 102 L239 123" stroke="#f7f8ff" stroke-width="2" filter="url(#glow)"/>
    </g>
  </g>
</svg>
