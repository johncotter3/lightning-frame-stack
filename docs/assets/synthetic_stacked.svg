      <ellipse cx="165" cy="58" rx="80" ry="27"/>
      <ellipse cx="270" cy="82" rx="72" ry="23"/>
      <ellipse cx="205" cy="113" rx="92" ry="19"/>
    </g>
    <path d="M0 205 L42 172 L91 198 L157 151 L222 199 L282 164 L340 190 L340 230 L0 230 Z" fill="#0b0c15"/>
    <rect y="215" width="340" height="15" fill="#070911"/>
    <g fill="#f2e6b3" opacity="0.75"><circle cx="28" cy="217" r="1.5"/><circle cx="83" cy="220" r="1.5"/><circle cx="145" cy="218" r="1.5"/><circle cx="249" cy="220" r="1.5"/><circle cx="315" cy="218" r="1.5"/></g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
